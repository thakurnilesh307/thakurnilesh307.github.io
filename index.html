<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMT Hiring Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
      background-color: #f5f6fa;
      color: #333;
    }
    .sidebar {
      width: 240px;
      background-color: #1f2937;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .sidebar h2 { font-size: 20px; margin-bottom: 30px; }
    .sidebar a {
      text-decoration: none;
      color: #cbd5e1;
      margin: 15px 0;
      font-size: 16px;
      cursor: pointer;
    }
    .sidebar a:hover { color: white; }
    .main { flex-grow: 1; padding: 30px; overflow-y: auto; }
    .hidden { display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .card h3 { margin-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>CMT Dashboard</h2>
    <a onclick="showPage('overview')">Overview</a>
    <a onclick="showPage('candidates')">Candidates</a>
    <a onclick="showPage('analytics')">Analytics</a>
  </div>

  <div class="main">
    <div id="overview" class="page">
      <div class="header">
        <h1>Key Metrics</h1>
      </div>
      <div class="grid">
        <div class="card">
          <h3>Total Applications</h3>
          <p><strong>505</strong></p>
        </div>
        <div class="card">
          <h3>Total Offers</h3>
          <p><strong>3</strong></p>
        </div>
        <div class="card">
          <h3>Offer Rate</h3>
          <p><strong>0.59%</strong></p>
        </div>
      </div>
    </div>

    <div id="candidates" class="page hidden">
      <div class="header">
        <h1>Stage Distribution</h1>
      </div>
      <div class="card">
        <h3>Development Candidates</h3>
        <canvas id="devChart"></canvas>
      </div>
      <div class="card">
        <h3>IoT Candidates</h3>
        <canvas id="iotChart"></canvas>
      </div>
    </div>

    <div id="analytics" class="page hidden">
      <div class="header">
        <h1>Analytics View</h1>
      </div>
      <div class="card">
        <p>More charts and KPIs coming soon...</p>
      </div>
    </div>
  </div>

  <script>
    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    const devCtx = document.getElementById("devChart").getContext("2d");
    const iotCtx = document.getElementById("iotChart").getContext("2d");

    new Chart(devCtx, {
      type: 'bar',
      data: {
        labels: ["Application Review", "Phone Screen", "Phone Interview", "Face to Face", "Offer"],
        datasets: [{
          label: 'Development',
          data: [503, 35, 21, 18, 3],
          backgroundColor: '#3b82f6'
        }]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

    new Chart(iotCtx, {
      type: 'bar',
      data: {
        labels: ["Application Review", "Phone Screen", "Phone Interview", "Face to Face", "Offer"],
        datasets: [{
          label: 'IoT',
          data: [2, 10, 1, 2, 0],
          backgroundColor: '#60a5fa'
        }]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

    showPage('overview');
  </script>
</body>
</html>
