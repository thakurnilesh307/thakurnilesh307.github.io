<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMT Hiring Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
      background-color: #f5f6fa;
      color: #333;
    }
    .sidebar {
      width: 240px;
      background-color: #1f2937;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 30px;
    }
    .sidebar a {
      text-decoration: none;
      color: #cbd5e1;
      margin: 15px 0;
      font-size: 16px;
    }
    .sidebar a:hover {
      color: white;
    }
    .main {
      flex-grow: 1;
      padding: 30px;
      overflow-y: auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .card h3 {
      margin-top: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    select, input, button {
      padding: 10px;
      width: 100%;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background-color: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .status {
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
    }
    .status.green { background-color: #10b981; }
    .status.red { background-color: #ef4444; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>CMT Dashboard</h2>
    <a href="#">Overview</a>
    <a href="#">Candidates</a>
    <a href="#">Analytics</a>
    <a href="#">Recruiters</a>
    <a href="#">Settings</a>
  </div>

  <div class="main">
    <div class="header">
      <h1>Candidate Overview</h1>
      <div style="width: 200px">
        <label>Filter by Stage:</label>
        <select id="stageFilter" onchange="filterData()">
          <option value="All">All</option>
          <option value="Phone Interview">Phone Interview</option>
          <option value="Face to Face">Face to Face</option>
          <option value="Offer">Offer</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>Candidate Stages</h3>
        <canvas id="barChart"></canvas>
      </div>
      <div class="card">
        <h3>Flagged Candidates</h3>
        <p><strong id="flaggedCount">0</strong> out of <strong id="totalCount">0</strong> candidates flagged</p>
      </div>
    </div>

    <div class="card">
      <h3>Add Candidate</h3>
      <form onsubmit="addCandidate(event)">
        <div class="grid">
          <div>
            <label for="newStage">Stage:</label>
            <select id="newStage">
              <option value="Phone Interview">Phone Interview</option>
              <option value="Face to Face">Face to Face</option>
              <option value="Offer">Offer</option>
            </select>
          </div>
          <div>
            <label for="newFlagged">Flagged?</label>
            <select id="newFlagged">
              <option value="No">No</option>
              <option value="Yes">Yes</option>
            </select>
          </div>
        </div>
        <button type="submit">Add Candidate</button>
      </form>
    </div>
  </div>

  <script>
    let rawData = [
      { stage: "Phone Interview", flagged: "No" },
      { stage: "Phone Interview", flagged: "No" },
      { stage: "Phone Interview", flagged: "No" },
      { stage: "Phone Interview", flagged: "No" },
      { stage: "Phone Interview", flagged: "Yes" },
      { stage: "Face to Face", flagged: "No" },
      { stage: "Face to Face", flagged: "Yes" },
      { stage: "Face to Face", flagged: "No" },
      { stage: "Face to Face", flagged: "No" },
      { stage: "Offer", flagged: "No" },
      { stage: "Offer", flagged: "No" },
      { stage: "Offer", flagged: "Yes" },
      { stage: "Offer", flagged: "No" }
    ];

    const ctx = document.getElementById("barChart").getContext("2d");
    const chart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: ["Phone Interview", "Face to Face", "Offer"],
        datasets: [{
          label: "Count",
          data: [0, 0, 0],
          backgroundColor: ["#60a5fa", "#3b82f6", "#2563eb"]
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    function updateChart(data) {
      const stages = { "Phone Interview": 0, "Face to Face": 0, "Offer": 0 };
      let flaggedCount = 0;

      data.forEach(row => {
        if (stages.hasOwnProperty(row.stage)) {
          stages[row.stage]++;
        }
        if (row.flagged === "Yes") flaggedCount++;
      });

      chart.data.datasets[0].data = [stages["Phone Interview"], stages["Face to Face"], stages["Offer"]];
      chart.update();

      document.getElementById("flaggedCount").textContent = flaggedCount;
      document.getElementById("totalCount").textContent = data.length;
    }

    function filterData() {
      const stage = document.getElementById("stageFilter").value;
      const filtered = stage === "All" ? rawData : rawData.filter(r => r.stage === stage);
      updateChart(filtered);
    }

    function addCandidate(e) {
      e.preventDefault();
      const stage = document.getElementById("newStage").value;
      const flagged = document.getElementById("newFlagged").value;
      rawData.push({ stage, flagged });
      filterData();
    }

    filterData();
  </script>
</body>
</html>
