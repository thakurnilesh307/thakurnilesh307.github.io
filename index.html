<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMT Hiring Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
      background-color: #f5f6fa;
      color: #333;
    }
    .sidebar {
      width: 240px;
      background-color: #1f2937;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .sidebar h2 { font-size: 20px; margin-bottom: 30px; }
    .sidebar a {
      text-decoration: none;
      color: #cbd5e1;
      margin: 15px 0;
      font-size: 16px;
      cursor: pointer;
    }
    .sidebar a:hover, .sidebar a.active {
      color: white;
      font-weight: 600;
    }
    .main {
      flex-grow: 1;
      padding: 30px;
      overflow-y: auto;
      background: white;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .card h3 { margin-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    select, input, button {
      padding: 10px;
      width: 100%;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background-color: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:hover { background-color: #1d4ed8; }
    .status {
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
    }
    .status.green { background-color: #10b981; }
    .status.red { background-color: #ef4444; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #2563eb;
      color: white;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>CMT Dashboard</h2>
    <a data-page="overview" class="active">Overview</a>
    <a data-page="candidates">Candidates</a>
    <a data-page="analytics">Analytics</a>
    <a data-page="recruiters">Recruiters</a>
    <a data-page="settings">Settings</a>
  </div>

  <div class="main">
    <!-- Overview Page -->
    <div id="page-overview" class="page" style="display: block;">
      <div class="header">
        <h1>Candidate Overview</h1>
        <div style="width: 200px">
          <label for="stageFilter">Filter by Stage:</label>
          <select id="stageFilter" onchange="filterData()">
            <option value="All">All</option>
            <option value="Phone Interview">Phone Interview</option>
            <option value="Face to Face">Face to Face</option>
            <option value="Offer">Offer</option>
          </select>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <h3>Candidate Stages</h3>
          <canvas id="barChart"></canvas>
        </div>
        <div class="card">
          <h3>Flagged Candidates</h3>
          <p><strong id="flaggedCount">0</strong> out of <strong id="totalCount">0</strong> candidates flagged</p>
        </div>
      </div>

      <div class="card">
        <h3>Add Candidate</h3>
        <form onsubmit="addCandidate(event)">
          <div class="grid">
            <div>
              <label for="newStage">Stage:</label>
              <select id="newStage">
                <option value="Phone Interview">Phone Interview</option>
                <option value="Face to Face">Face to Face</option>
                <option value="Offer">Offer</option>
              </select>
            </div>
            <div>
              <label for="newFlagged">Flagged?</label>
              <select id="newFlagged">
                <option value="No">No</option>
                <option value="Yes">Yes</option>
              </select>
            </div>
          </div>
          <button type="submit">Add Candidate</button>
        </form>
      </div>
    </div>

    <!-- Candidates Page -->
    <div id="page-candidates" class="page" style="display: none;">
      <h1>All Candidates</h1>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Stage</th>
            <th>Flagged</th>
          </tr>
        </thead>
        <tbody id="candidatesTableBody"></tbody>
      </table>
    </div>

    <!-- Analytics Page -->
    <div id="page-analytics" class="page" style="display: none;">
      <h1>Analytics</h1>
      <div class="card" style="max-width:600px;">
        <canvas id="analyticsChart"></canvas>
      </div>
      <div class="card">
        <h3>Recruiter KPI Performance</h3>
        <canvas id="kpiChart"></canvas>
      </div>
    </div>

    <script>
      let rawData = [];

      // KPI chart data
      const kpiLabels = [
        "Budapest - Kata Lebo", "Chennai - Recruiter 1", "Chennai HR", "Tokyo - Recruiter 2",
        "Cambridge Dev", "Cambridge IoT - Recruiter 4", "IoT Ops", "Cambridge Dev - Recruiter 5",
        "Cambridge Product", "Chennai Dev", "Cambridge Dev - Recruiter 3"
      ];
      const kpiData = {
        labels: kpiLabels,
        datasets: [
          { label: 'Days Open', data: [70, 90, 45, 95, 90, 60, 70, 45, 45, 85, 80], backgroundColor: '#3b82f6' },
          { label: 'New Candidates', data: [20, 8, 35, 3, 3, 20, 10, 30, 35, 10, 10], backgroundColor: '#ef4444' },
          { label: 'Phone Interviews', data: [5, 0, 10, 1, 5, 10, 10, 15, 15, 3, 6], backgroundColor: '#84cc16' },
          { label: 'HM Interviews', data: [4, 0, 5, 0, 2, 5, 5, 5, 5, 2, 2], backgroundColor: '#a855f7' },
          { label: 'F2F Interviews', data: [1, 2, 5, 1, 0, 5, 5, 5, 5, 0, 2], backgroundColor: '#f59e0b' }
        ]
      };
      const kpiConfig = {
        type: 'bar',
        data: kpiData,
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom' } },
          scales: {
            x: { stacked: true },
            y: { stacked: true }
          }
        }
      };
      new Chart(document.getElementById("kpiChart").getContext("2d"), kpiConfig);
    </script>
  </div>
</body>
</html>
