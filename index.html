<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CMT Hiring Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .tab-content { display: none; }
    .tab-active { display: block; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen overflow-hidden">

  <div class="flex h-full">
    <!-- Sidebar -->
    <aside class="w-60 bg-blue-800 text-white flex flex-col p-6 space-y-6">
      <h1 class="text-2xl font-bold">CMT Hiring</h1>
      <nav class="space-y-4">
        <button onclick="showTab('dashboard')" class="w-full text-left hover:text-blue-200">📊 Dashboard</button>
        <button onclick="showTab('form')" class="w-full text-left hover:text-blue-200">➕ Add Candidate</button>
        <button onclick="showTab('table')" class="w-full text-left hover:text-blue-200">📋 Candidate List</button>
        <button onclick="showTab('charts')" class="w-full text-left hover:text-blue-200">📈 Charts</button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 overflow-y-auto">

      <!-- Dashboard -->
      <section id="dashboard" class="tab-content tab-active grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white rounded-xl p-4 shadow border text-center">
          <p class="text-sm text-gray-500">Open Roles</p>
          <p class="text-2xl font-bold text-blue-600">24</p>
        </div>
        <div class="bg-white rounded-xl p-4 shadow border text-center">
          <p class="text-sm text-gray-500">Avg Time to Fill</p>
          <p class="text-2xl font-bold text-blue-600">18 days</p>
        </div>
        <div class="bg-white rounded-xl p-4 shadow border text-center">
          <p class="text-sm text-gray-500">Offer Acceptance</p>
          <p class="text-2xl font-bold text-blue-600">82%</p>
        </div>
        <div class="bg-white rounded-xl p-4 shadow border text-center">
          <p class="text-sm text-gray-500">Candidate Diversity</p>
          <p class="text-2xl font-bold text-blue-600">42%</p>
        </div>
      </section>

      <!-- Form -->
      <section id="form" class="tab-content">
        <div class="bg-white p-6 rounded-xl shadow border max-w-3xl">
          <h2 class="text-xl font-semibold mb-4">Add New Candidate</h2>
          <form id="candidateForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <input id="name" type="text" placeholder="Full Name" required class="p-2 border rounded" />
            <input id="role" type="text" placeholder="Role" required class="p-2 border rounded" />
            <input id="stage" type="text" placeholder="Stage" required class="p-2 border rounded" />
            <input id="source" type="text" placeholder="Source" required class="p-2 border rounded" />
            <div class="sm:col-span-2">
              <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Add</button>
            </div>
          </form>
        </div>
      </section>

      <!-- Table -->
      <section id="table" class="tab-content">
        <div class="bg-white p-4 rounded-xl shadow border overflow-x-auto">
          <h2 class="text-xl font-semibold mb-4">Candidate Table</h2>
          <table class="min-w-full text-sm border-collapse">
            <thead class="bg-gray-100">
              <tr>
                <th class="border px-4 py-2">Name</th>
                <th class="border px-4 py-2">Role</th>
                <th class="border px-4 py-2">Stage</th>
                <th class="border px-4 py-2">Source</th>
              </tr>
            </thead>
            <tbody id="candidateTableBody" class="bg-white">
              <!-- JS appends rows here -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Charts -->
      <section id="charts" class="tab-content grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white p-4 rounded-xl shadow border">
          <h2 class="text-lg font-semibold mb-2">Pipeline</h2>
          <canvas id="pipelineChart" height="200"></canvas>
        </div>
        <div class="bg-white p-4 rounded-xl shadow border">
          <h2 class="text-lg font-semibold mb-2">Source of Hire</h2>
          <canvas id="sourceChart" height="200"></canvas>
        </div>
      </section>

    </main>
  </div>

  <!-- Scripts -->
  <script>
    const tabs = document.querySelectorAll(".tab-content");
    function showTab(id) {
      tabs.forEach(tab => tab.classList.remove("tab-active"));
      document.getElementById(id).classList.add("tab-active");
    }

    const stageData = { "Applied": 500, "Interviewed": 80, "Offer Sent": 25, "Hired": 15 };
    const sourceData = { "Referrals": 35, "LinkedIn": 40, "Campus": 15, "Other": 10 };

    const pipelineChart = new Chart(document.getElementById('pipelineChart'), {
      type: 'bar',
      data: {
        labels: Object.keys(stageData),
        datasets: [{ data: Object.values(stageData), backgroundColor: '#3b82f6' }]
      },
      options: { plugins: { legend: { display: false } }, indexAxis: 'y' }
    });

    const sourceChart = new Chart(document.getElementById('sourceChart'), {
      type: 'doughnut',
      data: {
        labels: Object.keys(sourceData),
        datasets: [{ data: Object.values(sourceData), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444'] }]
      },
      options: { plugins: { legend: { position: 'bottom' } } }
    });

    document.getElementById("candidateForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const role = document.getElementById("role").value;
      const stage = document.getElementById("stage").value;
      const source = document.getElementById("source").value;

      const row = `<tr>
        <td class="border px-4 py-2">${name}</td>
        <td class="border px-4 py-2">${role}</td>
        <td class="border px-4 py-2">${stage}</td>
        <td class="border px-4 py-2">${source}</td>
      </tr>`;
      document.getElementById("candidateTableBody").insertAdjacentHTML("beforeend", row);

      stageData[stage] = (stageData[stage] || 0) + 1;
      sourceData[source] = (sourceData[source] || 0) + 1;

      pipelineChart.data.labels = Object.keys(stageData);
      pipelineChart.data.datasets[0].data = Object.values(stageData);
      pipelineChart.update();

      sourceChart.data.labels = Object.keys(sourceData);
      sourceChart.data.datasets[0].data = Object.values(sourceData);
      sourceChart.update();

      this.reset();
    });
  </script>
</body>
</html>
